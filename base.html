<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockSense{% if title %} · {{ title }}{% endif %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">StockSense</span>
    </div>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint=='dashboard' }}">Dashboard</a>
      <a href="{{ url_for('products') }}" class="{{ 'active' if request.endpoint=='products' }}">Products</a>
      <div class="nav-group-label">Operations</div>
      <a href="{{ url_for('receipts') }}" class="{{ 'active' if request.endpoint=='receipts' }}">Receipts</a>
      <a href="{{ url_for('deliveries') }}" class="{{ 'active' if request.endpoint=='deliveries' }}">Delivery orders</a>
      <a href="{{ url_for('transfers') }}" class="{{ 'active' if request.endpoint=='transfers' }}">Internal transfers</a>
      <a href="{{ url_for('adjustments') }}" class="{{ 'active' if request.endpoint=='adjustments' }}">Adjustments</a>
      <a href="{{ url_for('ledger') }}" class="{{ 'active' if request.endpoint=='ledger' }}">Stock ledger</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">{{ session.get('username','') }}</div>
      <a href="{{ url_for('logout') }}" class="logout-link">Log out</a>
    </div>
  </aside>
  <main class="content">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
